# Carry a merged `shared` pull request to the sibling chain repo.
#
# The two repos — `stellar` and `solana`, under the same organization — share
# the agent, the MCP package, the landing and the sandbox, and differ only in
# the chain layer. A change to the shared part is made in whichever repo it
# was needed first, labeled `shared`, and on merge this workflow:
#
#   1. clones the sibling repo,
#   2. cherry-picks the merged change onto its main with `-x`, so the commit
#      names the hash it came from,
#   3. pushes it as `sync/<this repo>-<PR number>`,
#   4. opens a pull request there, titled `sync: <original title>`.
#
# A human reviews and merges that PR, same as any other. The original author
# stays the author of the cherry-picked commit; the bot is only the committer.
#
# If the cherry-pick conflicts, no half-applied branch is pushed. An issue is
# opened in the sibling repo instead with the exact commands to do it by hand,
# because a conflict is a decision and the right person to make it is
# whoever owns that repo.
#
# ## Why a PAT
#
# `GITHUB_TOKEN` is scoped to this repo and cannot push to another, and a PR
# it opens would not trigger the sibling's own CI. `SYNC_TOKEN` is a
# fine-grained personal access token with **Contents: read and write** and
# **Pull requests: read and write** (also **Issues: read and write**, for the
# conflict path) on both repos, stored as a repository secret in both. Rotate
# it like any other credential; it can push to main of both repos.
#
# ## Merge method
#
# Squash and merge-commit are handled. Rebase-merge is not: it lands N commits
# with no marker tying them together, and `merge_commit_sha` is only the last
# one. Turn rebase merging off in both repos' settings.
#
# ## Loop guard
#
# The PR opened here is never labeled `shared`, and a PR whose branch starts
# with `sync/` is skipped even if somebody adds the label by hand. Either one
# alone would prevent a ping-pong; both are cheap.
name: Sync shared change

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  sync:
    name: cherry-pick into the sibling repo
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'shared') &&
      !startsWith(github.event.pull_request.head.ref, 'sync/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      SOURCE: ${{ github.event.repository.name }}
      PR: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Name the sibling
        id: sibling
        run: |
          set -euo pipefail
          case "$SOURCE" in
            solana)  echo "name=stellar" >> "$GITHUB_OUTPUT" ;;
            stellar) echo "name=solana"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::This repo is '$SOURCE'; sync.yml only knows 'stellar' and 'solana'."; exit 1 ;;
          esac

      - name: Refuse to run without the token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not set. Add it as a repository secret (see the header of this workflow)."
            exit 1
          fi

      - name: Clone the sibling and fetch the merged commit
        env:
          SIBLING: ${{ steps.sibling.outputs.name }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${SIBLING}.git" sibling
          cd sibling
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${SOURCE}.git" "$MERGE_SHA"

      - name: Cherry-pick
        id: pick
        working-directory: sibling
        env:
          SIBLING: ${{ steps.sibling.outputs.name }}
        run: |
          set -euo pipefail
          branch="sync/${SOURCE}-${PR}"
          git checkout --quiet -b "$branch" origin/main

          # A merge commit has two parents and is picked against the first;
          # a squash commit has one and is picked as it is.
          parents=$(git rev-list --parents -n 1 "$MERGE_SHA" | wc -w)
          if [ "$parents" -ge 3 ]; then pick_args="-m 1"; else pick_args=""; fi

          if ! git cherry-pick -x $pick_args "$MERGE_SHA"; then
            # Two ways to fail: files in conflict, or nothing left to apply
            # because main already has it. Only the first needs a human.
            if git diff --name-only --diff-filter=U | grep -q .; then
              git cherry-pick --abort || true
              echo "outcome=conflict" >> "$GITHUB_OUTPUT"
              echo "::warning::Cherry-pick of $MERGE_SHA conflicts with $SIBLING/main; opening an issue instead of a PR."
            else
              git cherry-pick --quit || true
              echo "outcome=empty" >> "$GITHUB_OUTPUT"
              echo "Nothing to sync: $SIBLING/main already contains this change."
            fi
            exit 0
          fi

          echo "outcome=pushed" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git push --quiet --force origin "$branch"

      # The PR title and body are user text and reach the shell only as
      # variables passed to printf's %s, never inside a heredoc or a format
      # string, so a title containing `$(…)` is a title and nothing else.
      - name: Open the pull request
        if: steps.pick.outputs.outcome == 'pushed'
        working-directory: sibling
        env:
          SIBLING: ${{ steps.sibling.outputs.name }}
          BRANCH: ${{ steps.pick.outputs.branch }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          {
            printf 'Synced from %s/%s#%s (%s), merged as `%s`, by @%s.\n\n' \
              "$OWNER" "$SOURCE" "$PR" "$PR_URL" "$MERGE_SHA" "$PR_AUTHOR"
            printf '%s\n\n---\n\n' 'Review it as you would any other change to the shared code. The cherry-pick carries the original author and message; the commit body names the source hash.'
            printf '%s\n' "$PR_BODY"
          } > "$RUNNER_TEMP/body.md"
          existing=$(gh pr list --repo "${OWNER}/${SIBLING}" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $BRANCH; branch updated."
            gh pr comment "$existing" --repo "${OWNER}/${SIBLING}" \
              --body "Branch force-pushed with the latest cherry-pick of \`${MERGE_SHA}\`."
          else
            gh pr create --repo "${OWNER}/${SIBLING}" \
              --base main --head "$BRANCH" \
              --title "sync: ${PR_TITLE}" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Open an issue for the conflict
        if: steps.pick.outputs.outcome == 'conflict'
        env:
          SIBLING: ${{ steps.sibling.outputs.name }}
        run: |
          set -euo pipefail
          {
            printf '%s/%s#%s (%s) is labeled `shared` and merged as `%s`, but it does not cherry-pick cleanly onto this repo'"'"'s main.\n\nTo bring it over by hand:\n\n```sh\n' \
              "$OWNER" "$SOURCE" "$PR" "$PR_URL" "$MERGE_SHA"
            printf 'git fetch origin && git checkout -b sync/%s-%s origin/main\n' "$SOURCE" "$PR"
            printf 'git fetch https://github.com/%s/%s.git %s\n' "$OWNER" "$SOURCE" "$MERGE_SHA"
            printf 'git cherry-pick -x %s        # add -m 1 if it is a merge commit\n' "$MERGE_SHA"
            printf '# resolve, then:\ngit push -u origin sync/%s-%s\n' "$SOURCE" "$PR"
            printf 'gh pr create --title "sync: %s" --body "Manual cherry-pick of %s/%s#%s"\n```\n\n' "$PR_TITLE" "$OWNER" "$SOURCE" "$PR"
            printf '%s\n' 'Until this lands, the shared code in the two repos differs.'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "${OWNER}/${SIBLING}" \
            --title "sync conflict: ${PR_TITLE} (${SOURCE}#${PR})" \
            --body-file "$RUNNER_TEMP/issue.md"
