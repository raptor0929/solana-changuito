[package]
name = "changuito_escrow"
version = "0.1.0"
description = "Escrow for a grocery basket paid in USDC on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "changuito_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.0", features = ["token"] }
